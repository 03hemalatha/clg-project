services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend Static Site ──────────────────────────────────────────────────────
  - type: web                         # 🟢 FIXED: Type must remain 'web'
    name: clgproject
    env: static                       # 🟢 FIXED: Env handles static tracking
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://onrender.com
    autoDeploy: true


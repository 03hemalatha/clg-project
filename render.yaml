services:
  # ── Backend API (Dynamic Web Service) ────────────────────────────────────────
  - type: web
    name: backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://clgproject.onrender.com  # 🟢 FIXED: Points to frontend address
      # Secrets placeholders - Render will securely prompt you for these
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend Static Site (Valid Infrastructure Spec) ─────────────────────────────
  - type: web                         # 🟢 FIXED: Top-level type must be 'web'
    name: clgproject
    runtime: static                   # 🟢 FIXED: Must use 'runtime: static'
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://onrender.com  # 🟢 FIXED: Points to actual backend address
    autoDeploy: true

